name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dev tooling
        run: npm install --no-audit --no-fund

      # The check that would have caught the original data bugs: missing
      # fields, duplicate dishes, and filter options no meal can satisfy.
      - name: Validate meal data
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check
